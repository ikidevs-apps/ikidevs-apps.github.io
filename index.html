<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ikidevs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: #F8F6F2;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .page-wrapper {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      padding: 48px 0 0;
      text-align: center;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      color: #6B6B6B;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Hero */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 64px 0 48px;
    }

    .mountain-emoji {
      font-size: 64px;
      margin-bottom: 24px;
      display: block;
    }

    .app-name {
      font-size: 56px;
      font-weight: 800;
      color: #4A7C59;
      letter-spacing: -0.02em;
      line-height: 1;
      margin-bottom: 16px;
    }

    .headline {
      font-size: 24px;
      font-weight: 700;
      color: #1A1A1A;
      margin-bottom: 12px;
    }

    .coming-soon {
      font-size: 16px;
      font-weight: 600;
      color: #6B6B6B;
      margin-bottom: 48px;
    }

    .store-badges {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .store-badge {
      background-color: #1A1A1A;
      color: #F8F6F2;
      font-family: 'Nunito', sans-serif;
      font-size: 13px;
      font-weight: 700;
      padding: 12px 24px;
      border-radius: 12px;
      text-decoration: none;
      letter-spacing: 0.02em;
      opacity: 0.45;
      cursor: default;
    }

    .store-badge span {
      display: block;
      font-size: 10px;
      font-weight: 600;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .tagline-sub {
      font-size: 13px;
      color: #6B6B6B;
      margin-top: 8px;
    }

    /* Divider */
    .divider {
      height: 1px;
      background-color: #E8E4DE;
      margin: 0;
    }

    /* Footer */
    footer {
      padding: 24px 0 32px;
      text-align: center;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .footer-links a {
      font-size: 13px;
      font-weight: 600;
      color: #4A7C59;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    .footer-copy {
      font-size: 12px;
      color: #6B6B6B;
    }

    @media (max-width: 480px) {
      .app-name {
        font-size: 44px;
      }

      .headline {
        font-size: 20px;
      }

      .store-badges {
        flex-direction: column;
        align-items: center;
      }

      .store-badge {
        width: 200px;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrapper">

    <header>
      <p class="brand">ikidevs</p>
    </header>

    <main class="hero">
      <span class="mountain-emoji">⛰️</span>
      <h1 class="app-name">CLIMB</h1>
      <p class="headline">We build apps.</p>
      <p class="coming-soon">CLIMB — coming soon to App Store and Google Play</p>

      <div class="store-badges">
        <a class="store-badge">
          <span>Coming soon</span>
          App Store
        </a>
        <a class="store-badge">
          <span>Coming soon</span>
          Google Play
        </a>
      </div>

      <p class="tagline-sub">Study smarter. Climb higher.</p>
    </main>

    <div class="divider"></div>

    <footer>
      <div class="footer-links">
        <a href="climb/support/index.html">Support</a>
        <a href="climb/privacy/index.html">Privacy Policy</a>
      </div>
      <p class="footer-copy">© 2026 ikidevs. All rights reserved.</p>
    </footer>

  </div>
</body>
</html>
